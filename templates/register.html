{% extends "base.html" %}
{% block title %}Register · NutriHealth{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">JOIN THE COMMUNITY</span>
    <h1>Create Your Account</h1>
    <p class="muted">Sign up to start tracking your nutrition and health data privately.</p>

    <form method="POST" action="{{ url_for('register') }}" id="registerForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required minlength="3">
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
        <small class="hint">At least 6 characters.</small>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        <small class="hint" id="matchHint"></small>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
